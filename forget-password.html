<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealPro || Real State Website</title>
    <!-- font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <!-- icon  -->
    <link rel="shortcut icon" href="assets/img/logo.png">
    <!-- css  -->
    <link rel="stylesheet" href="sass/main.css">
</head>

<body>
    <section class="auth">
        <div class="auth__container">

            <div class="auth__header">
                <h1 class="auth__title">Reset Password</h1>

                <p class="auth__description">
                    Enter the e-mail address associated with the account.
                    <br>
                    We'll e-mail a link to reset your password.
                </p>
            </div>

            <form class="auth__form">

                <div class="auth__field">
                    <input type="email" class="auth__input" placeholder="Email" required>
                </div>

                <button type="submit" class="auth__button">
                    Send Request Link
                </button>

                <a href="login.html" class="auth__link">
                    Register Back To Login
                </a>

            </form>

        </div>
    </section>
</body>

</html>
