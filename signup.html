<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealPro || Real State Website</title>
    <!-- font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <!-- icon  -->
    <link rel="shortcut icon" href="assets/img/logo.png">
    <!-- css  -->
    <link rel="stylesheet" href="sass/main.css">
</head>

<body>
    <main class="signup">
        <div class="signup__container">
            <!-- Header -->
            <header class="signup__header">

                <h1 class="signup__title">
                    Sign Up
                </h1>

                <p class="signup__description">
                    Please enter your details to create a new account.
                </p>

            </header>

            <!-- Form -->
            <form class="signup__form">

                <!-- Username -->
                <div class="signup__field">

                    <div class="signup__input-wrapper">

                        <input class="signup__input" type="text" placeholder="UseName" required>

                    </div>

                </div>

                <!-- Email -->
                <div class="signup__field">

                    <div class="signup__input-wrapper">

                        <input class="signup__input" type="email" placeholder="Email" required>

                    </div>

                </div>

                <!-- Password -->
                <div class="signup__field">

                    <div class="signup__input-wrapper">

                        <input class="signup__input signup__input--password" type="password" id="signup-password"
                            placeholder="Password" required>

                        <button class="signup__password-toggle" type="button" id="signup-password-toggle">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>

                <!-- Repeat Password -->
                <div class="signup__field">

                    <div class="signup__input-wrapper">

                        <input class="signup__input" type="password" id="signup-repeat-password"
                            placeholder="Repeat Password" required>

                    </div>

                </div>

                <!-- Submit -->
                <button class="signup__button" type="submit">
                    Sign Up
                </button>

            </form>

            <!-- Login -->
            <p class="signup__login">

                Are you a member?

                <a class="signup__login-link" href="login.html">
                    Login Now
                </a>
            </p>
        </div>
    </main>
</body>

</html>
